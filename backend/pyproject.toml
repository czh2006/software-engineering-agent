[tool.poetry]
name = "backend"
version = "0.1.0"
description = "AI Software Engineering Agent — Backend (FastAPI)"
authors = ["AI Software Engineering Agent Team"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.6"
uvicorn = { extras = ["standard"], version = "^0.34.0" }
pydantic = "^2.10.4"
pydantic-settings = "^2.7.1"
sqlalchemy = "^2.0.36"
asyncpg = "^0.30.0"
redis = "^5.2.1"
alembic = "^1.14.0"
email-validator = "^2.2.0"
tree-sitter = "^0.26.0"
tree-sitter-python = "^0.25.0"
tree-sitter-typescript = "^0.23.2"
chromadb = "^1.5.9"
openai = "^3.8.0"
langgraph = "^1.2.11"

[tool.poetry.group.dev.dependencies]
ruff = "^0.8.6"
pytest = "^8.3.4"
pytest-asyncio = "^0.25.2"
httpx = "^0.28.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
